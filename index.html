<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/salvador.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Salvador Resolve - A Premium Video Editor</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Salvador Resolve - A Premium Video Editor" />
    <meta name="description" content="A modern, high-performance video editor engineered using Tauri, React, and Rust. Experience a professional NLE timeline, hardware acceleration, and visual asset pools directly on your machine—with mobile versions coming soon." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Salvador Resolve - A Premium Video Editor" />
    <meta property="og:description" content="A modern, high-performance video editor engineered using Tauri, React, and Rust. Experience a professional NLE timeline, hardware acceleration, and visual asset pools directly on your machine—with mobile versions coming soon." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Salvador Resolve - A Premium Video Editor" />
    <meta property="twitter:description" content="A modern, high-performance video editor engineered using Tauri, React, and Rust. Experience a professional NLE timeline, hardware acceleration, and visual asset pools directly on your machine—with mobile versions coming soon." />

    <!--
      ┌─────────────────────────────────────────────────────────────────────┐
      │  THEME BOOTSTRAP — runs before first paint, zero flash              │
      │                                                                     │
      │  Reads the persisted theme from localStorage["salvador-settings"]    │
      │  (Zustand persist key) and stamps data-theme on <html> immediately. │
      │  Falls back to the OS preference, then "dark".                     │
      │                                                                     │
      │  Must stay inline & synchronous — never move to an external file.  │
      └─────────────────────────────────────────────────────────────────────┘
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("salvador-settings");
          var saved = raw ? JSON.parse(raw)?.state?.appearance : null;
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          /* localStorage blocked (private mode / sandboxed) — keep default dark */
        }
      })();
    </script>

    <style>
      /*
       * ── Design token primitives ─────────────────────────────────────────
       * Inline only the values that the loading screen needs before the main
       * CSS bundle loads. Keep in sync with src/design-tokens.css.
       *
       * Primitives (theme-invariant):
       *   --ds-neutral-950  #0b0e12   --ds-neutral-50   #f4f6f8
       *   --ds-neutral-900  #12171d   --ds-neutral-100  #e4e9ee
       *   --ds-accent-500   #5ab8d4   --ds-accent-700   #2a7d99
       */

      /* Dark — default (:root) */
      :root,
      [data-theme="dark"] {
        --salvador-surface-app:    #0b0e12;
        --salvador-accent-primary: #5ab8d4;
        --salvador-spinner-track:  #12171d;
        --salvador-text-muted:     rgba(237, 242, 244, 0.42);
        --salvador-accent-glow:    rgba(90, 184, 212, 0.07);
        color-scheme: dark;
      }

      /* Light */
      [data-theme="light"] {
        --salvador-surface-app:    #f4f6f8;
        --salvador-accent-primary: #2a7d99;
        --salvador-spinner-track:  #e4e9ee;
        --salvador-text-muted:     rgba(17, 24, 39, 0.42);
        --salvador-accent-glow:    rgba(42, 125, 153, 0.06);
        color-scheme: light;
      }

      /* ── Reset ────────────────────────────────────────────────────────── */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--salvador-surface-app);
        color-scheme: inherit;
      }

      /* ── Pre-React loading overlay ────────────────────────────────────── */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(ellipse 55% 35% at 50% 0%, var(--salvador-accent-glow) 0%, transparent 65%),
          var(--salvador-surface-app);
        /* Fade out gracefully once React content fills #root */
        opacity: 1;
        visibility: visible;
        transition: opacity 0.25s ease, visibility 0.25s ease;
        pointer-events: none; /* never blocks interaction */
        z-index: 9999;
      }

      #app-loading .logo {
        width: 36px;
        height: 36px;
        opacity: 0.6;
      }

      #app-loading .spinner {
        width: 26px;
        height: 26px;
        border: 2px solid var(--salvador-spinner-track);
        border-top-color: var(--salvador-accent-primary);
        border-radius: 50%;
        animation: salvador-spin 0.75s linear infinite;
      }

      @keyframes salvador-spin {
        to { transform: rotate(360deg); }
      }

      /* ── Hide once React mounts content ──────────────────────────────── */
      #root:not(:empty) ~ #app-loading {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="app-loading" aria-hidden="true">
      <img class="logo" src="/salvador.svg" alt="" />
      <div class="spinner"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
